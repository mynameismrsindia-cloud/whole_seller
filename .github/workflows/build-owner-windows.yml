name: Build owner Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Build Windows release
        working-directory: owner_desktop
        run: |
          flutter pub get
          flutter build windows --release
      - name: Download and verify Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          $redist = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest `
            -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
            -OutFile $redist
          $signature = Get-AuthenticodeSignature -FilePath $redist
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw 'The downloaded Visual C++ Redistributable has no valid Microsoft signature.'
          }
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'owner_desktop\build\installer'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          Copy-Item $redist (Join-Path $installerDir 'vc_redist.x64.exe')
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'owner_desktop\build\installer'
          & $compiler "/O$outputDir" 'owner_desktop\installer\owner_desktop.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: owner-desktop-Setup
          path: owner_desktop/build/installer/owner-desktop-Setup.exe
          if-no-files-found: error
          retention-days: 14
