name: Build owner Windows app

on:
  workflow_dispatch:
    inputs:
      environment:
        description: API environment for this Windows build
        type: choice
        options:
          - production
          - localhost
        default: production
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Build Windows release
        working-directory: owner_desktop
        env:
          API_ENVIRONMENT: ${{ inputs.environment }}
          PRODUCTION_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || vars.API_BASE_URL || 'https://wholesellerbackend-production.up.railway.app/api/v1' }}
        run: |
          if ($env:API_ENVIRONMENT -eq 'localhost') {
            $apiBaseUrl = 'http://127.0.0.1:3000/api/v1'
          } else {
            $apiBaseUrl = $env:PRODUCTION_API_BASE_URL
            if ([string]::IsNullOrWhiteSpace($apiBaseUrl) -or
                -not $apiBaseUrl.StartsWith('https://')) {
              throw 'Set PRODUCTION_API_BASE_URL (or legacy API_BASE_URL) to the deployed HTTPS API URL.'
            }
          }
          flutter pub get
          flutter build windows --release --dart-define=API_BASE_URL=$apiBaseUrl
      - uses: actions/upload-artifact@v4
        with:
          name: owner-desktop-windows-x64
          path: owner_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
