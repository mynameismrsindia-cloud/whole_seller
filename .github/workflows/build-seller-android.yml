name: Build seller Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Build seller release APK
        working-directory: seller_app
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ] || [[ "$API_BASE_URL" != https://* ]]; then
            echo "Set the API_BASE_URL repository variable to the deployed HTTPS API URL."
            exit 1
          fi
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: actions/upload-artifact@v4
        with:
          name: seller-app-android-apk
          path: seller_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
