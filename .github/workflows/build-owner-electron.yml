name: Build Owner Electron

on:
  workflow_dispatch:
  push:
    paths:
      - "owner_electron/**"
      - ".github/workflows/build-owner-electron.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: owner_electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owner_electron/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: owner-electron-windows
          path: owner_electron/dist/*.exe
          if-no-files-found: error
          retention-days: 14
