name: Build owner Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true
      - name: Build Windows release
        working-directory: owner_desktop
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: owner-desktop-windows-x64
          path: owner_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
